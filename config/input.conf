# Toggle NVIDIA RTX Video Super Resolution and show the active filter chain.
Ctrl+v vf toggle @rtx-vsr:d3d11vpp=format=nv12:scale=2:scaling-mode=nvidia; show-text "RTX VSR filter: ${vf}"

# Useful controls for consistent comparisons.
Ctrl+b vf clr ""; show-text "All video filters bypassed"
Ctrl+i show-text "Source: ${video-params/w}x${video-params/h} | Output: ${width}x${height} | Filters: ${vf}" 4000

# ReShade also uses Home for its overlay. Give mpv a harmless real command so
# the key still reaches ReShade, without seeking or pausing its present loop.
HOME no-osd add volume 0
